name: Update TAIFEX Data

on:
  # === Reliable way (recommended) ===
  # Use an external cron service (cron-job.org etc.) to call the GitHub API
  # and trigger this workflow at exact time. Much more reliable than schedule:.
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of recent trading days to fetch'
        required: false
        default: '7'

  # === Fallback only (GitHub schedule is best-effort and can be hours late) ===
  schedule:
    - cron: '5 7 * * 1-5'    # ~15:05 TW
    - cron: '5 11 * * 1-5'   # ~19:05 TW
    - cron: '5 15 * * 1-5'   # ~23:05 TW

permissions:
  contents: read   # no longer need to push to git for data
  id-token: write  # for OIDC with AWS (recommended)

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch recent TAIFEX data
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          python scripts/download_historical_institutional.py --days "$DAYS"
        env:
          PYTHONUNBUFFERED: "1"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Option A (recommended for production): OIDC
          # role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

          # Option B (quick start): store long-lived keys as repo secrets
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Upload Parquet files to S3
        run: |
          # Upload the partitioned Parquet data
          aws s3 sync data/parquet/ s3://${{ secrets.S3_BUCKET }}/taifex/ --delete --exact-timestamps

          # Also upload last update marker (optional but convenient)
          if [ -f data/last_update.txt ]; then
            aws s3 cp data/last_update.txt s3://${{ secrets.S3_BUCKET }}/taifex/last_update.txt
          fi

          echo "Data uploaded to s3://${{ secrets.S3_BUCKET }}/taifex/"
