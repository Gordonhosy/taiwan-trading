name: Update TAIFEX Data

on:
  schedule:
    # Runs daily at 15:05 Taiwan time (07:05 UTC)
    - cron: '5 7 * * *'
  workflow_dispatch:   # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch recent TAIFEX data
        run: |
          python scripts/download_historical_institutional.py --days 5
        env:
          # Add any env vars here if needed in the future
          PYTHONUNBUFFERED: "1"

      - name: Commit and push updated database (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/taifex.db

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to data/taifex.db"
          else
            git commit -m "chore(data): update TAIFEX institutional data [skip ci]"
            git push
          fi
