name: Update TAIFEX Data

on:
  # === Reliable way (recommended) ===
  # Use an external cron service (cron-job.org etc.) to call the GitHub API
  # and trigger this workflow at exact time. Much more reliable than schedule:.
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of recent trading days to fetch'
        required: false
        default: '7'

  # === Fallback only (GitHub schedule is best-effort and can be hours late) ===
  schedule:
    - cron: '5 7 * * 1-5'    # ~15:05 TW
    - cron: '5 11 * * 1-5'   # ~19:05 TW
    - cron: '5 15 * * 1-5'   # ~23:05 TW

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch recent TAIFEX data
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          python scripts/download_historical_institutional.py --days "$DAYS"
        env:
          # Add any env vars here if needed in the future
          PYTHONUNBUFFERED: "1"

      - name: Commit and push updated database (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/taifex.db data/last_update.txt

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to data/taifex.db"
          else
            git commit -m "chore(data): update TAIFEX institutional data [skip ci]"
            # Handle case where remote has moved ahead (common with multiple triggers)
            git fetch origin
            git rebase origin/main || echo "Rebase skipped or not needed"
            git push origin HEAD:main
          fi
